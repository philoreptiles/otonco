<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./img/otonco.png">
    <meta name="color-scheme" content="dark">
    <title>Otonco PIMVS</title>
</head>
<body>
    <div id="header-root"></div>
    <div id="hero-root"></div>

    <main class="main-container">
        <div id="featured-root"></div>

        <!-- Buscador + barra de filtros tipo "pills" (sticky al hacer scroll).
             El markup lo genera src/components/ui/filters/filters.js dentro de
             este contenedor; filters.css lo deja como display: contents para
             que la barra se pegue mientras se recorre todo el catálogo. -->
        <div id="filters-root"></div>

        <!-- Galería del catálogo -->
        <div id="catalog-root"></div>
    </main>

    <div id="footer-root"></div>

    <!-- Modal Base Estática -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-container">
            <button type="button" class="modal-close" id="modal-close-btn" aria-label="Cerrar">&times;</button>
            <div class="modal-body" id="modal-body-content"></div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
