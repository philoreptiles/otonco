name = "criadores-upload-imagenes"
main = "worker.js"
compatibility_date = "2026-09-01"

# Conecta este Worker directamente al bucket de R2 -- por esto no
# hace falta ninguna llave de acceso tipo S3 en ningún lado: el
# binding le da acceso al Worker desde dentro de Cloudflare.
[[r2_buckets]]
binding = "BUCKET_EJEMPLARES"
bucket_name = "criadores-imagenes"

# Variables normales (no secretas -- ver README.md para los valores
# reales de tu cuenta). SUPABASE_ANON_KEY es pública por diseño
# (es la misma que usa el sitio), así que no hace falta guardarla
# como secret.
[vars]
